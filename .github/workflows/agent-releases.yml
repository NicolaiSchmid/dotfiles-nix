name: Agent releases
on:
  pull_request:
  push:
    branches: [main]
jobs:
  macos-agents:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Evaluate MacBook configuration
        run: nix eval --raw path:./darwin#darwinConfigurations.nicolais-MacBook-Pro.system.drvPath
      - name: Build and smoke test updated packages
        run: |
          nix build --impure --expr '
            let
              flake = builtins.getFlake ("path:" + toString ./darwin);
              pkgs = flake.inputs.nixpkgs.legacyPackages.aarch64-darwin;
              apps = import ./darwin/packages/ai-apps.nix { inherit pkgs; };
            in [ apps.codex apps.claude-code apps.t3code apps.t3codeNightly ]
          ' --out-link result-agent
          ./result-agent/bin/codex --version
          ./result-agent-2/bin/claude --version
          test -x "result-agent-3/Applications/T3 Code.app/Contents/MacOS/T3 Code (Beta)"
          test -x "result-agent-4/Applications/T3 Code Nightly.app/Contents/MacOS/T3 Code (Nightly)"
